# Unified deploy: single k2-stack container (gateway + frontend + internal nginx).
# External proxy forwards one upstream to STACK_PROXY_PORT (default 8088).
# See deploy/README.md
version: "3.8"

services:
  db-bootstrap:
    image: registry.kasemsan.com/k2-stack:${TAG:-1.4.0}
    restart: "no"
    env_file:
      - ../.env
    entrypoint: ["/app/gateway/db-bootstrap"]
    working_dir: /app/gateway
    network_mode: host

  k2-stack:
    image: registry.kasemsan.com/k2-stack:${TAG:-1.4.0}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      STACK_PROXY_PORT: ${STACK_PROXY_PORT:-8088}
      API_PORT: ${API_PORT:-8080}
      FRONTEND_PORT: ${FRONTEND_PORT:-4173}
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/admin/}
      DB_BOOTSTRAP_ON_START: "false"
    network_mode: host
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
