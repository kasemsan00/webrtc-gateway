# Split deploy: frontend + gateway (2 containers).
# Path routing (/admin, /api, /ws) is configured on external nginx/Coolify.
# See deploy/nginx.external.conf.example and deploy/README.md.
version: "3.8"

services:
  db-bootstrap:
    image: registry.kasemsan.com/k2-gateway:${TAG:-1.4.0}
    restart: "no"
    env_file:
      - ../.env
    entrypoint: ["./db-bootstrap"]
    working_dir: /app
    network_mode: host

  frontend:
    image: registry.kasemsan.com/k2-frontend:${TAG:-1.4.0}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/admin/}
      PORT: ${FRONTEND_PORT:-4173}
    network_mode: host

  webrtc-gateway:
    image: registry.kasemsan.com/k2-gateway:${TAG:-1.4.0}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_BOOTSTRAP_ON_START: "false"
      API_PORT: ${API_PORT:-8080}
    network_mode: host
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
