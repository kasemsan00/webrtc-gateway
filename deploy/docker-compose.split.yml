# Split deploy: frontend + gateway (2 containers).
# Path routing (/admin, /api, /ws) is configured on external nginx/Coolify.
# See deploy/nginx.external.conf.example and deploy/README.md.
version: "3.8"

services:
  frontend:
    image: registry.kasemsan.com/k2-frontend:${TAG:-1.3.2}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      VITE_BASE_PATH: ${VITE_BASE_PATH:-/admin/}
      PORT: ${FRONTEND_PORT:-4173}
    network_mode: host

  webrtc-gateway:
    image: registry.kasemsan.com/k2-gateway:${TAG:-1.3.2}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      API_PORT: ${API_PORT:-8080}
    network_mode: host
